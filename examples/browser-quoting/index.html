<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hayabusa Router — Browser Quoting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: monospace; background: #0a0a0a; color: #e0e0e0; padding: 2rem; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; color: #fff; }
    .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.85rem; }
    label { display: block; color: #aaa; margin-bottom: 0.3rem; font-size: 0.85rem; }
    input, select, button { font-family: monospace; font-size: 0.9rem; }
    input, select { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 0.5rem; width: 100%; border-radius: 4px; }
    input:focus, select:focus { outline: none; border-color: #666; }
    .row { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .row > div { flex: 1; }
    button { background: #2a6; color: #fff; border: none; padding: 0.7rem 1.5rem; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 1rem; }
    button:hover { background: #3b7; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    #log { margin-top: 2rem; background: #111; border: 1px solid #222; border-radius: 6px; padding: 1rem; min-height: 200px; white-space: pre-wrap; font-size: 0.8rem; line-height: 1.5; overflow-y: auto; max-height: 500px; }
    .log-status { color: #888; }
    .log-route { color: #6af; }
    .log-result { color: #4d8; }
    .log-error { color: #e55; }
  </style>
</head>
<body>
  <h1>Hayabusa Router — Browser Quoting</h1>
  <p class="subtitle">Full BFS pathfinder with WASM EVM quoter. Requires state-server on ws://localhost:7449.</p>

  <div class="row">
    <div>
      <label>Sell</label>
      <input id="amountIn" type="text" value="1" />
    </div>
    <div>
      <label>From</label>
      <select id="tokenIn">
        <option value="WAVAX" selected>AVAX</option>
        <option value="USDC">USDC</option>
      </select>
    </div>
    <div>
      <label>To</label>
      <select id="tokenOut">
        <option value="USDC" selected>USDC</option>
        <option value="WAVAX">AVAX</option>
      </select>
    </div>
  </div>

  <div>
    <label>State Server</label>
    <input id="stateServerUrl" type="text" value="ws://localhost:7449" />
  </div>

  <button id="quoteBtn">Quote</button>
  <div id="log"></div>

  <!-- Go WASM runtime support (symlinked from evm-quoter/bin/) -->
  <script src="/bin/wasm_exec.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
